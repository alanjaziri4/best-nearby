<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>Best Nearby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--ink:#171717;--muted:#6f6a61;--card:#fff;--line:#ded8cf;--accent:#9a6a2d}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{text-align:center;max-width:560px;margin:auto;padding:38px 18px calc(42px + env(safe-area-inset-bottom))}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
.propertyName{font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(27px,7.5vw,38px);font-weight:400;line-height:1.35;color:var(--accent);margin:14px 0 16px;text-wrap:balance}
h1{font-family:Georgia,serif;font-size:48px;line-height:.95;margin:10px 0 8px;letter-spacing:-.03em}.sub{margin:0 0 24px;color:var(--muted);font-size:17px}
.pickerWrap{position:relative}.pickerWrap:after{content:"⌄";position:absolute;right:18px;top:50%;transform:translateY(-54%);font-size:25px;pointer-events:none}
select{text-align:center;text-align-last:center;appearance:none;width:100%;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--line);background:#fff;border-radius:18px;padding:17px 52px;color:var(--ink);box-shadow:0 6px 25px rgba(0,0,0,.05)}
.card{margin-top:18px;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:22px;box-shadow:0 10px 35px rgba(0,0,0,.055)}.category{font-size:14px;font-weight:800;color:var(--accent)}
h2{font-size:30px;line-height:1.05;margin:8px 0 8px}.blurb{color:var(--muted);margin:0 0 15px}.perk{border-radius:15px;background:var(--bg);padding:14px 15px;margin:0 0 16px}.perk b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}a.btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:14px;font-weight:800}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.footer{text-align:center;color:#9b958d;font-size:12px;margin-top:28px}
.pitch{display:none;margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:16px}.pitch.on{display:block}.pitch label{display:block;font-size:12px;margin:8px 0 5px}.pitch input{text-align:center;width:100%;font-size:16px;border:0;border-radius:10px;padding:11px}.pitch button{text-align:center;width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;font-weight:800}
@media(max-width:360px){h1{font-size:42px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">LOCAL GUEST GUIDE</div>
  <p class="propertyName">The Villas at Norwich Inn</p>
  <h1 id="siteTitle">Best Nearby</h1>
  <p class="sub" id="subtitle">Our local picks for your stay</p>
  <div class="pickerWrap"><select id="picker" autocomplete="off" aria-label="Choose a Best category"></select></div>
  <section class="card" id="card">
    <div class="category" id="category"></div>
    <h2 id="business"></h2>
    <p class="blurb" id="blurb"></p>
    <div class="perk"><b>Guest perk</b><span id="perk"></span></div>
    <div class="actions"><a id="website" class="btn primary" target="_blank" rel="noopener">Website</a><a id="directions" class="btn secondary" target="_blank" rel="noopener">Directions</a></div>
  </section>
  <div class="pitch" id="pitch"><strong>Pitch Mode</strong><label>Business name</label><input id="pitchBusiness"><label>Guest perk</label><input id="pitchPerk"><button id="applyPitch">Preview sponsor</button></div>
  <div class="footer">One local pick per category.</div>
</main>
<script src="sponsors.js?v=cfa4f66a2b94"></script>
<script>
const cfg=window.BEST_NEARBY, $=id=>document.getElementById(id), picker=$("picker");
$("siteTitle").textContent=cfg.siteTitle; $("subtitle").textContent=cfg.subtitle;
cfg.categories.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.dataset.category=x.category;o.textContent=`${x.emoji||""} ${x.category}`.trim();picker.appendChild(o)});
function render(i){const x=cfg.categories[i];$("category").textContent=`${x.emoji||""}  ${x.category==="Best of the Best"?x.category:`Best ${x.category}`}`;$("business").textContent=x.business;$("blurb").textContent=x.blurb;$("perk").textContent=x.perk;$("website").href=x.website;$("directions").href=x.directions}
picker.addEventListener("change",()=>render(+picker.value));
const defaultIndex=Math.max(0,cfg.categories.findIndex(x=>x.category==="Best of the Best"));
picker.value=String(defaultIndex);render(defaultIndex);
const params=new URLSearchParams(location.search);if(params.get("pitch")==="1"){$("pitch").classList.add("on");$("applyPitch").onclick=()=>{if($("pitchBusiness").value)$("business").textContent=$("pitchBusiness").value;if($("pitchPerk").value)$("perk").textContent=$("pitchPerk").value}}
</script>
</body></html>
